services:
  sensor-dash:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sensor-dash
    ports:
      - "5000:5000"
    restart: unless-stopped
    environment:
      # Set Flask to run in production mode
      FLASK_ENV: production
      # Optional: set this on Pi to proxy API data from desktop, e.g. http://192.168.1.50:5000
      # Leave empty for local sensor mode (desktop source server)
      UPSTREAM_API_BASE: ${UPSTREAM_API_BASE:-}
    volumes:
      # Mount /sys for sensor access on host
      - /sys:/sys:ro
      # Mount /proc for system info
      - /proc:/proc:ro
    privileged: false
    networks:
      - monitor-network

networks:
  monitor-network:
    driver: bridge
